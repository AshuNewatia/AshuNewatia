<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <style>
      700&family=Orbitron:wght@700;900&display=swap');
      
      .bg { fill: #0a0a0f; }
      .grid { stroke: rgba(0, 255, 255, 0.05); stroke-width: 1; }
      .frame { stroke: #0ff; stroke-width: 2; fill: none; opacity: 0.8; }
      .glow-box { fill: rgba(0, 255, 255, 0.05); stroke: rgba(0, 255, 255, 0.3); stroke-width: 1; }
      
      .title {
        font-family: 'Orbitron', sans-serif;
        font-size: 38px;
        font-weight: 900;
        fill: #fff;
        text-shadow: 0 0 10px #0ff, 0 0 20px #0ff, 0 0 40px #0ff;
        animation: glitch 3s infinite alternate;
      }
      
      .terminal {
        font-family: 'Fira Code', monospace;
        font-size: 14px;
        fill: #0ff;
      }
      
      .green-text { fill: #0f0; text-shadow: 0 0 5px #0f0; }
      .pink-text { fill: #f0f; text-shadow: 0 0 5px #f0f; }
      .white-text { fill: #fff; }
      
      .typewriter {
        opacity: 0;
        animation: fadeIn 0.1s forwards;
      }
      
      .line1 { animation-delay: 0.5s; }
      .line2 { animation-delay: 1.5s; }
      .line3 { animation-delay: 2.5s; }
      .line4 { animation-delay: 3.5s; }
      .line5 { animation-delay: 4.5s; }
      
      .cursor {
        fill: #0ff;
        animation: blink 1s step-end infinite;
      }
      
      .scanline {
        width: 100%;
        height: 10px;
        fill: rgba(0, 255, 255, 0.1);
        animation: scan 4s linear infinite;
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      @keyframes scan {
        0% { transform: translateY(-10px); }
        100% { transform: translateY(410px); }
      }

      @keyframes glitch {
        0%, 100% { transform: translate(0); }
        20% { transform: translate(-2px, 2px); }
        40% { transform: translate(-2px, -2px); }
        60% { transform: translate(2px, 2px); }
        80% { transform: translate(2px, -2px); }
      }
      
      @keyframes fadeIn {
        to { opacity: 1; }
      }
    </style>
    
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none" class="grid" />
      <path d="M 40 0 L 0 0 0 40" fill="none" class="grid" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" class="bg" />
  <rect width="800" height="400" fill="url(#cyber-grid)" />
  
  <!-- Outer Frame -->
  <rect x="10" y="10" width="780" height="380" class="frame" rx="5" />
  <path d="M 10 40 L 40 10 M 790 360 L 760 390" stroke="#0ff" stroke-width="2" />
  
  <!-- Scanline Overlay -->
  <rect x="0" y="0" width="800" height="10" class="scanline" />

  <!-- Main Title -->
  <text x="50" y="80" class="title">ASHU_NEWATIA</text>
  <text x="50" y="110" class="terminal pink-text" style="font-size: 16px; font-weight: bold;">>> SYS.ADMIN // B.TECH CSE @ IIT_INDORE</text>

  <!-- Terminal Box -->
  <rect x="50" y="140" width="700" height="210" class="glow-box" rx="3" />
  <circle cx="70" cy="155" r="5" fill="#f00" opacity="0.7" />
  <circle cx="90" cy="155" r="5" fill="#ff0" opacity="0.7" />
  <circle cx="110" cy="155" r="5" fill="#0f0" opacity="0.7" />
  <line x1="50" y1="170" x2="750" y2="170" stroke="rgba(0,255,255,0.3)" stroke-width="1" />

  <!-- Terminal Typing Content -->
  <g class="terminal">
    <text x="70" y="200" class="typewriter line1">
      <tspan class="pink-text">ashu@mainframe</tspan><tspan class="white-text">:</tspan><tspan class="green-text">~</tspan><tspan class="white-text">$</tspan> ./initialize_profile.sh
    </text>
    
    <text x="70" y="230" class="typewriter line2">
      <tspan class="green-text">[OK]</tspan> Loading Core Modules: <tspan class="white-text">C++ | React.js | Next.js | MongoDB | TypeScript</tspan>
    </text>
    
    <text x="70" y="260" class="typewriter line3">
      <tspan class="green-text">[OK]</tspan> Establishing WebSocket: <tspan class="white-text">CampusFlow (Dual-Sync Workspace) ONLINE</tspan>
    </text>
    
    <text x="70" y="290" class="typewriter line4">
      <tspan class="green-text">[OK]</tspan> Initializing Voice Protocol: <tspan class="white-text">IMF Tactical Agent via LiveKit WebRTC</tspan>
    </text>
    
    <text x="70" y="320" class="typewriter line5">
      <tspan class="pink-text">ashu@mainframe</tspan><tspan class="white-text">:</tspan><tspan class="green-text">~</tspan><tspan class="white-text">$</tspan> fetch_metrics --cf-rating
    </text>
    
    <!-- Blinking Cursor -->
    <rect x="360" y="308" width="10" height="15" class="cursor typewriter" style="animation-delay: 4.5s;" />
  </g>
  
  <!-- Decoration -->
  <path d="M 680 150 L 730 150 L 730 330 L 680 330" fill="none" stroke="#0ff" stroke-width="1" opacity="0.3" stroke-dasharray="4" />
</svg>