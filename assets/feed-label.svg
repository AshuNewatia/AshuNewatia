<svg xmlns="http://www.w3.org/2000/svg" width="300" height="34"
     viewBox="0 0 300 34" role="img" aria-labelledby="t d"
     font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','Courier New',monospace">
  <title id="t">Workspace feed</title>
  <desc id="d">Workspace feed is active</desc>
  <defs>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%"
            color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ff0055" stroke-opacity=".08"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d151c"/>
      <stop offset="1" stop-color="#080b10"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff0055" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ff0055" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ff0055" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><path d="M8 0H300V26L292 34H0V8Z"/></clipPath>
  </defs>
  <path d="M8 0H300V26L292 34H0V8Z" fill="url(#bg)"/>
  <path d="M8 0H300V26L292 34H0V8Z" fill="url(#grid)"/>
  <path d="M8 0H300V26L292 34H0V8Z" fill="none" stroke="#ff0055" stroke-opacity=".32" stroke-width="1.2"/>
  <path d="M8 0H300V26L292 34H0V8Z" fill="none" stroke="#ff0055" stroke-width="2.2"
        pathLength="1000" stroke-dasharray="90 910" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="1000" to="0"
             dur="7s" repeatCount="indefinite"/>
  </path>
  <path d="M260 10H290V40" fill="none" stroke="#ff0055" stroke-width="2"/>
  <path d="M10 -6V24H40" fill="none" stroke="#ff0055" stroke-width="2"/>

  
  <circle cx="26" cy="17" r="5" fill="#ff0055" filter="url(#glow)">
    <animate attributeName="opacity" values="1;.2;1" dur="1s" repeatCount="indefinite"/>
  </circle>
  <text x="44" y="22" font-size="12" fill="#ff0055" letter-spacing="3">REC</text>
  <text x="282" y="22" font-size="12" fill="#b8cfd0" text-anchor="end"
        letter-spacing="2">WORKSPACE FEED // ACTIVE</text>
</svg>
