<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1100"
  height="350"
  viewBox="0 0 1100 350"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">{{NAME}} — profile terminal</title>

  <desc id="desc">
    Animated terminal with profile and positions.
  </desc>

  <defs>
    <linearGradient id="scan" x2="0" y2="1">
      <stop stop-color="#00ffcc" stop-opacity="0" />
      <stop offset=".5" stop-color="#00ffcc" stop-opacity=".12" />
      <stop offset="1" stop-color="#00ffcc" stop-opacity="0" />
    </linearGradient>

    <pattern
      id="crt"
      width="4"
      height="4"
      patternUnits="userSpaceOnUse"
    >
      <rect
        width="4"
        height="2"
        fill="#000"
        opacity=".20"
      />
    </pattern>

    <clipPath id="screen">
      <rect
        x="8"
        y="8"
        width="1084"
        height="334"
        rx="12"
      />
    </clipPath>

    <filter
      id="glow"
      x="-50%"
      y="-100%"
      width="200%"
      height="300%"
    >
      <feGaussianBlur stdDeviation="2" result="b" />

      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url(
      'https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&amp;display=swap'
    );

    text {
      font-family: 'Fira Code', 'Courier New', monospace;
    }

    .name {
      fill: #00ffcc;
      font-size: 38px;
      font-weight: 700;
      filter: url(#glow);
      animation: glitch 7s infinite;
    }

    .head {
      font-size: 13px;
      fill: #6ec5a4;
    }

    .pink {
      fill: #ff3377;
      font-weight: 700;
    }

    .green {
      fill: #00ff77;
    }

    .muted {
      fill: #b6d6ca;
    }

    .terminal {
      font-size: 17px;
    }

    .line {
      opacity: 1;
      animation: appear .3s both;
    }

    .l1 { animation-delay: .3s; }
    .l2 { animation-delay: .8s; }
    .l3 { animation-delay: 1.3s; }
    .l4 { animation-delay: 1.8s; }
    .l5 { animation-delay: 2.3s; }
    .l6 { animation-delay: 2.8s; }

    .scan {
      animation: scan 5s linear infinite;
    }

    .cursor {
      animation: blink 1s step-end infinite;
    }

    .dot {
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateX(-8px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes scan {
      from {
        transform: translateY(-100px);
      }

      to {
        transform: translateY(450px);
      }
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    @keyframes pulse {
      50% {
        opacity: .3;
      }
    }

    @keyframes glitch {
      0%, 92%, 96%, 100% {
        transform: translateX(0);
      }

      93% {
        transform: translateX(-2px);
      }

      94% {
        transform: translateX(2px);
      }

      95% {
        transform: translateX(-1px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .line {
        opacity: 1;
        animation: none;
      }

      .name,
      .dot,
      .cursor {
        animation: none;
      }

      .scan {
        display: none;
      }
    }
  </style>

  <rect
    width="1100"
    height="350"
    rx="16"
    fill="#000"
  />

  <rect
    x="8"
    y="8"
    width="1084"
    height="334"
    rx="12"
    fill="#030907"
    stroke="#00ffcc"
    stroke-opacity=".75"
  />

  <g clip-path="url(#screen)">
    <!-- Terminal title bar -->

    <rect
      x="8"
      y="8"
      width="1084"
      height="38"
      fill="#071c17"
    />

    <circle cx="31" cy="27" r="5" fill="#ff0055" />
    <circle cx="49" cy="27" r="5" fill="#ffb45b" />
    <circle cx="67" cy="27" r="5" fill="#00ff77" />

    <text x="91" y="32" class="head">
      ASHU@IIT-INDORE:~ / PROFILE
    </text>

    <circle
      cx="993"
      cy="27"
      r="4"
      fill="#00ff77"
      class="dot"
    />

    <text x="1005" y="32" class="head">
      ONLINE
    </text>

    <!-- Identity -->

    <text x="35" y="101" class="name">
      {{NAME}}
    </text>

    <text x="37" y="127" class="head pink">
      &gt;&gt; {{TITLE}}
    </text>

    <line
      x1="36"
      y1="145"
      x2="1064"
      y2="145"
      stroke="#00ffcc"
      stroke-opacity=".25"
    />

    <!-- Terminal output -->

    <g class="terminal">
      <text x="38" y="178" class="line l1">
        <tspan class="pink">ashu@iit:~$ </tspan>
        <tspan fill="#00ffcc">whoami</tspan>
      </text>

      <text x="38" y="204" class="line l2 muted">
        {{BIO}}
      </text>

      <text x="38" y="238" class="line l3">
        <tspan class="pink">ashu@iit:~$ </tspan>
        <tspan fill="#00ffcc">cat roles.txt</tspan>
      </text>

      <text x="38" y="264" class="line l4 green">
        [01] {{ROLE_1}}
      </text>

      <text x="38" y="289" class="line l5 green">
        [02] {{ROLE_2}}
      </text>

      <text x="38" y="314" class="line l6 green">
        [03] {{ROLE_3}}
        <tspan class="cursor">▉</tspan>
      </text>
    </g>

    <!-- CRT texture -->

    <rect
      x="8"
      y="8"
      width="1084"
      height="334"
      fill="url(#crt)"
    />

    <!-- Moving scanline -->

    <rect
      x="8"
      y="0"
      width="1084"
      height="100"
      fill="url(#scan)"
      class="scan"
    />
  </g>
</svg>