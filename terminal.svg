<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1100"
  height="400"
  viewBox="0 0 1100 400"
  role="img"
  aria-labelledby="svg-title svg-description"
>
  <title id="svg-title">Ashu Newatia — Cyberpunk HUD</title>

  <desc id="svg-description">
    Animated cyberpunk profile dashboard with roles, Codeforces rating,
    system status, and last synchronization time.
  </desc>

  <defs>
    <!-- Neon glow -->
    <filter
      id="glow"
      x="-50%"
      y="-100%"
      width="200%"
      height="300%"
      color-interpolation-filters="sRGB"
    >
      <feGaussianBlur
        in="SourceGraphic"
        stdDeviation="2.5"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Softer glow for larger shapes -->
    <filter
      id="soft-glow"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%"
    >
      <feGaussianBlur
        in="SourceGraphic"
        stdDeviation="6"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Background grid -->
    <pattern
      id="grid"
      width="42"
      height="42"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M 42 0 H 0 V 42"
        fill="none"
        stroke="#00ffcc"
        stroke-opacity=".12"
        stroke-width=".6"
      />
    </pattern>

    <!-- Fine CRT scanline texture -->
    <pattern
      id="crt-lines"
      width="4"
      height="4"
      patternUnits="userSpaceOnUse"
    >
      <rect
        width="4"
        height="1"
        fill="#000000"
        opacity=".28"
      />
    </pattern>

    <!-- Moving scanline -->
    <linearGradient id="scan-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ffcc" stop-opacity="0" />
      <stop offset=".5" stop-color="#00ffcc" stop-opacity=".12" />
      <stop offset="1" stop-color="#00ffcc" stop-opacity="0" />
    </linearGradient>

    <!-- Background illumination -->
    <radialGradient id="ambient-cyan">
      <stop offset="0" stop-color="#00ffcc" stop-opacity=".11" />
      <stop offset="1" stop-color="#00ffcc" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ambient-pink">
      <stop offset="0" stop-color="#ff0055" stop-opacity=".09" />
      <stop offset="1" stop-color="#ff0055" stop-opacity="0" />
    </radialGradient>

    <clipPath id="screen-clip">
      <path d="M 24 8 H 1055 L 1092 45 V 376 L 1076 392 H 45 L 8 355 V 24 Z" />
    </clipPath>

    <!--
      Each text line is revealed by expanding its own clipping rectangle.
      The rectangles have their full width by default, so the text remains
      visible if a viewer does not run CSS animations.
    -->
    <clipPath id="reveal-1">
      <rect class="reveal r1" x="0" y="0" width="1000" height="24" />
    </clipPath>

    <clipPath id="reveal-2">
      <rect class="reveal r2" x="0" y="0" width="1000" height="24" />
    </clipPath>

    <clipPath id="reveal-3">
      <rect class="reveal r3" x="0" y="0" width="1000" height="24" />
    </clipPath>

    <clipPath id="reveal-4">
      <rect class="reveal r4" x="0" y="0" width="1000" height="24" />
    </clipPath>

    <clipPath id="reveal-5">
      <rect class="reveal r5" x="0" y="0" width="1000" height="24" />
    </clipPath>

    <clipPath id="reveal-6">
      <rect class="reveal r6" x="0" y="0" width="1000" height="24" />
    </clipPath>

    <clipPath id="reveal-7">
      <rect class="reveal r7" x="0" y="0" width="1000" height="24" />
    </clipPath>
  </defs>

  <style>
    text {
      font-family: "Courier New", Courier, monospace;
    }

    .screen {
      animation: crt-flicker 8s linear infinite;
    }

    .cyan {
      fill: #00ffcc;
    }

    .pink {
      fill: #ff0055;
    }

    .green {
      fill: #00ff77;
    }

    .yellow {
      fill: #ffff00;
    }

    .muted {
      fill: #a1c6bd;
    }

    .dim {
      fill: #568d82;
    }

    .neon {
      filter: url(#glow);
    }

    .label {
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1.5px;
    }

    .tiny {
      font-size: 10px;
      letter-spacing: 1px;
    }

    .terminal-text {
      font-size: 14px;
      letter-spacing: .2px;
    }

    .name {
      fill: #00ffcc;
      font-size: 42px;
      font-weight: bold;
      letter-spacing: 3px;
      filter: url(#glow);
      animation: glitch 8s infinite;
    }

    .scanline {
      animation: scan 7s linear infinite;
    }

    .status-dot {
      animation: pulse 2s ease-in-out infinite;
    }

    .cursor {
      animation: blink 1s steps(1, end) infinite;
    }

    .orbit {
      transform-origin: 942px 157px;
      animation: orbit 18s linear infinite;
    }

    .orbit-reverse {
      transform-origin: 942px 157px;
      animation: orbit 12s linear infinite reverse;
    }

    .reveal {
      transform-box: fill-box;
      transform-origin: left center;
      animation-name: type;
      animation-duration: 1s;
      animation-timing-function: steps(36, end);
      animation-fill-mode: both;
    }

    .r1 { animation-delay: .3s; }
    .r2 { animation-delay: 1.0s; }
    .r3 { animation-delay: 1.7s; }
    .r4 { animation-delay: 2.4s; }
    .r5 { animation-delay: 3.1s; }
    .r6 { animation-delay: 3.8s; }
    .r7 { animation-delay: 4.5s; }

    @keyframes type {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    @keyframes scan {
      from { transform: translateY(-80px); }
      to { transform: translateY(420px); }
    }

    @keyframes crt-flicker {
      0%, 18%, 20%, 46%, 48%, 75%, 77%, 100% {
        opacity: 1;
      }

      19%, 47%, 76% {
        opacity: .94;
      }
    }

    /*
      The uneven timing simulates irregular glitches.
      CSS keyframes themselves cannot generate random timing.
    */
    @keyframes glitch {
      0%, 83%, 85%, 91%, 93%, 100% {
        transform: translateX(0);
        text-shadow: none;
      }

      83.5% {
        transform: translateX(-3px);
        text-shadow: 3px 0 #ff0055, -3px 0 #00aaff;
      }

      84% {
        transform: translateX(3px);
        text-shadow: -3px 0 #ff0055, 3px 0 #00aaff;
      }

      91.5% {
        transform: translateX(2px);
        text-shadow: -2px 0 #ff0055, 2px 0 #00aaff;
      }

      92% {
        transform: translateX(-2px);
        text-shadow: 2px 0 #ff0055, -2px 0 #00aaff;
      }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .35; }
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @keyframes orbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .screen,
      .name,
      .status-dot,
      .cursor,
      .orbit,
      .orbit-reverse,
      .reveal {
        animation: none;
      }

      .scanline {
        display: none;
      }
    }
  </style>

  <!-- Outer chassis -->
  <path
    d="M 24 8 H 1055 L 1092 45 V 376 L 1076 392 H 45 L 8 355 V 24 Z"
    fill="#030609"
    stroke="#00ffcc"
    stroke-opacity=".65"
    stroke-width="1.2"
  />

  <g class="screen" clip-path="url(#screen-clip)">
    <!-- Background -->
    <rect width="1100" height="400" fill="#030609" />
    <rect width="1100" height="400" fill="url(#grid)" />

    <ellipse
      cx="240"
      cy="100"
      rx="380"
      ry="180"
      fill="url(#ambient-cyan)"
    />

    <ellipse
      cx="950"
      cy="310"
      rx="300"
      ry="180"
      fill="url(#ambient-pink)"
    />

    <!-- Header bar -->
    <path
      d="M 8 8 H 1055 L 1092 45 H 8 Z"
      fill="#061512"
      fill-opacity=".92"
    />

    <path
      d="M 28 45 H 1072"
      stroke="#00ffcc"
      stroke-opacity=".35"
    />

    <circle cx="35" cy="27" r="4" fill="#ff0055" />
    <circle cx="51" cy="27" r="4" fill="#ffff00" />
    <circle cx="67" cy="27" r="4" fill="#00ff77" />

    <text x="89" y="31" class="label dim">
      ASHU@IIT-INDORE // PROFILE INTERFACE
    </text>

    <circle
      cx="969"
      cy="27"
      r="4"
      fill="#00ff77"
      class="status-dot neon"
    />

    <text x="982" y="31" class="label green">
      ONLINE
    </text>

    <!-- Decorative corner crosshairs -->
    <g fill="none" stroke="#00ffcc" stroke-opacity=".65">
      <path d="M 26 73 V 58 H 41 M 26 66 H 33 M 33 58 V 65" />
      <path d="M 1074 73 V 58 H 1059 M 1074 66 H 1067 M 1067 58 V 65" />
      <path d="M 26 327 V 342 H 41 M 26 334 H 33 M 33 342 V 335" />
      <path d="M 1074 327 V 342 H 1059 M 1074 334 H 1067 M 1067 342 V 335" />
    </g>

    <!-- Main identity -->
    <text x="43" y="83" class="tiny pink neon">
      IDENTITY VERIFIED // ACCESS LEVEL 01
    </text>

    <text x="40" y="132" class="name">
      Ashu Newatia
    </text>

    <text x="43" y="155" class="label pink neon">
      &gt;&gt; B.TECH CSE / IIT INDORE
    </text>

    <path
      d="M 43 170 H 694 L 708 184 H 792"
      fill="none"
      stroke="#00ffcc"
      stroke-opacity=".4"
      stroke-width="1"
    />

    <path
      d="M 43 170 H 170"
      fill="none"
      stroke="#00ffcc"
      stroke-width="2"
      class="neon"
    />

    <!-- Terminal output -->
    <g class="terminal-text">
      <g transform="translate(43 184)">
        <g clip-path="url(#reveal-1)">
          <text y="16">
            <tspan class="pink">$</tspan>
            <tspan class="cyan"> whoami</tspan>
          </text>
        </g>
      </g>

      <g transform="translate(43 207)">
        <g clip-path="url(#reveal-2)">
          <text y="16" class="muted">Building real-time products and intelligent interfaces.</text>
        </g>
      </g>

      <g transform="translate(43 234)">
        <g clip-path="url(#reveal-3)">
          <text y="16">
            <tspan class="pink">$</tspan>
            <tspan class="cyan"> cat roles.txt</tspan>
          </text>
        </g>
      </g>

      <g transform="translate(43 257)">
        <g clip-path="url(#reveal-4)">
          <text y="16" class="green">[01] WEB DEV DOMAIN LEAD / GDG IIT INDORE</text>
        </g>
      </g>

      <g transform="translate(43 280)">
        <g clip-path="url(#reveal-5)">
          <text y="16" class="green">[02] COORDINATOR / CSESA</text>
        </g>
      </g>

      <g transform="translate(43 303)">
        <g clip-path="url(#reveal-6)">
          <text y="16" class="green">[03] CODEFORCES / COMPETITIVE PROGRAMMING</text>
        </g>
      </g>

      <g transform="translate(43 326)">
        <g clip-path="url(#reveal-7)">
          <text y="16">
            <tspan class="pink">$</tspan>
            <tspan class="cyan"> telemetry --sync</tspan>
            <tspan class="cursor cyan"> ▉</tspan>
          </text>
        </g>
      </g>
    </g>

    <!-- Right-hand HUD panel -->
    <path
      d="M 826 67 H 1038 L 1060 89 V 276 L 1042 294 H 826 L 810 278 V 83 Z"
      fill="#020c0b"
      fill-opacity=".82"
      stroke="#00ffcc"
      stroke-opacity=".42"
    />

    <path
      d="M 826 67 H 900 M 986 294 H 1042 L 1060 276"
      fill="none"
      stroke="#ff0055"
      stroke-width="1.5"
      class="neon"
    />

    <text x="830" y="91" class="tiny dim">
      LIVE TELEMETRY // CF
    </text>

    <!-- Rotating radar -->
    <circle
      cx="942"
      cy="157"
      r="49"
      fill="none"
      stroke="#00ffcc"
      stroke-opacity=".15"
    />

    <circle
      cx="942"
      cy="157"
      r="36"
      fill="none"
      stroke="#00ffcc"
      stroke-opacity=".18"
    />

    <g class="orbit">
      <circle
        cx="942"
        cy="157"
        r="49"
        fill="none"
        stroke="#00ffcc"
        stroke-width="2"
        stroke-dasharray="45 24 5 234"
        class="neon"
      />
      <circle cx="942" cy="108" r="3" fill="#00ffcc" />
    </g>

    <g class="orbit-reverse">
      <circle
        cx="942"
        cy="157"
        r="36"
        fill="none"
        stroke="#ff0055"
        stroke-width="1.5"
        stroke-dasharray="28 12 4 182"
        class="neon"
      />
    </g>

    <path
      d="M 925 157 H 959 M 942 140 V 174"
      stroke="#00ffcc"
      stroke-opacity=".3"
    />

    <circle
      cx="942"
      cy="157"
      r="3"
      fill="#ff0055"
      class="neon"
    />

    <text
      x="942"
      y="232"
      text-anchor="middle"
      class="tiny dim"
    >
      CODEFORCES MAX RATING
    </text>

    <text
      x="942"
      y="264"
      text-anchor="middle"
      class="cyan neon"
      font-size="27"
      font-weight="bold"
      letter-spacing="2"
    >
      N/A
    </text>

    <!-- Footer -->
    <path
      d="M 43 360 H 1057"
      stroke="#00ffcc"
      stroke-opacity=".23"
    />

    <text x="43" y="379" class="tiny dim">
      SYS.SYNC: 2026-11-18 22:57:47Z
    </text>

    <text
      x="1057"
      y="379"
      text-anchor="end"
      class="tiny pink"
    >
      END OF TRANSMISSION // 01
    </text>

    <!-- CRT texture and moving scanline -->
    <rect
      width="1100"
      height="400"
      fill="url(#crt-lines)"
      pointer-events="none"
    />

    <rect
      class="scanline"
      x="0"
      y="0"
      width="1100"
      height="80"
      fill="url(#scan-gradient)"
      pointer-events="none"
    />
  </g>

  <!-- Bright exterior accents -->
  <path
    d="M 24 8 H 180 M 920 8 H 1055 L 1092 45"
    fill="none"
    stroke="#00ffcc"
    stroke-width="1.4"
    class="neon"
  />

  <path
    d="M 8 295 V 355 L 45 392 H 190"
    fill="none"
    stroke="#ff0055"
    stroke-width="1.2"
    class="neon"
  />
</svg>