name: Refresh profile analytics

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'README.md'
      - 'scripts/update_analytics.py'
      - 'tests/test_telemetry.py'
      - '.github/workflows/profile-analytics.yml'

permissions:
  contents: write

concurrency:
  group: profile-analytics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check telemetry calculations
        run: python -m unittest discover -s tests -v
      - name: Fetch actual GitHub telemetry
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: python scripts/update_analytics.py
      - name: Commit fetched data and README telemetry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/analytics.svg assets/telemetry.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: fetch GitHub telemetry"
          git pull --rebase
          git push
