name: Refresh profile analytics

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_analytics.py'
      - '.github/workflows/profile-analytics.yml'

permissions:
  contents: write

concurrency:
  group: profile-analytics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public data and render telemetry
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_analytics.py
      - name: Commit refreshed chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/analytics.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh profile telemetry"
          git push
